name: Nightly quality gates

on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
  workflow_dispatch:

jobs:
  dast:
    name: OWASP ZAP against staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: infra/zap/rules.tsv
          fail_action: true

  load:
    name: k6 performance profiles
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.STAGING_URL }}
      ACCESS_TOKEN: ${{ secrets.STAGING_LOAD_ACCESS_TOKEN }}
      NOISY_TOKEN: ${{ secrets.STAGING_NOISY_TENANT_TOKEN }}
      QUIET_TOKEN: ${{ secrets.STAGING_QUIET_TENANT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run infra/k6/normal.js
      - run: k6 run infra/k6/peak.js
      - run: k6 run infra/k6/spike.js
      - run: k6 run infra/k6/noisy-tenant.js

  restore:
    name: Backup restore verification
    if: vars.AWS_DR_ENABLED == 'true'
    runs-on: [self-hosted, linux, dr]
    timeout-minutes: 300
    environment: production-dr
    permissions: {id-token: write, contents: read}
    env:
      SOURCE_DB_INSTANCE_ID: ${{ vars.SOURCE_DB_INSTANCE_ID }}
      RESTORE_DB_SUBNET_GROUP: ${{ vars.RESTORE_DB_SUBNET_GROUP }}
      RESTORE_DB_SECURITY_GROUP_IDS: ${{ vars.RESTORE_DB_SECURITY_GROUP_IDS }}
      RESTORE_DATABASE_NAME: ${{ vars.RESTORE_DATABASE_NAME }}
      SOURCE_DATABASE_SECRET_ARN: ${{ secrets.SOURCE_DATABASE_SECRET_ARN }}
      DR_EVIDENCE_PATH: dr-evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install --require-hashes --no-deps -r backend/requirements-dev.lock
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DR_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Restore the latest snapshot and verify RPO/RTO
        run: bash infra/scripts/verify-restore.sh
      - name: Preserve drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-evidence-${{ github.run_id }}
          path: dr-evidence.json
          if-no-files-found: error
          retention-days: 365

  ai-eval:
    name: AI gold-set evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --require-hashes --no-deps -r backend/requirements-dev.lock
      - name: Evaluate against the versioned gold sets
        run: cd backend && python src/scripts/run_ai_evals.py --fail-under 0.85
