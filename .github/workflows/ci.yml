name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # 1. lint / typecheck ------------------------------------------------------
  static:
    name: Lint, types and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e "backend[dev]"
      - name: Ruff
        run: cd backend && ruff check src tests && ruff format --check src tests
      - name: mypy (strict)
        run: cd backend && mypy
      - name: Module boundaries (import-linter)
        run: cd backend && lint-imports
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}", cache: pnpm}
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm lint && pnpm typecheck

  # 2. unit / component -----------------------------------------------------
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e "backend[dev]"
      - run: cd backend && pytest tests/unit --cov --cov-report=xml --cov-report=term
      - name: Enforce the coverage floor
        run: cd backend && coverage report --fail-under=80
      - uses: actions/upload-artifact@v4
        with: {name: backend-coverage, path: backend/coverage.xml}

  # 3. integration / contract ----------------------------------------------
  integration:
    name: Integration, contract and E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: airevenueos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/airevenueos_test
      ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/airevenueos_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/airevenueos_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e "backend[dev]"
      - name: Migrations up and down (expand/contract reversibility)
        run: cd backend && alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Integration, contract and E2E suites
        run: cd backend && pytest tests/integration tests/contract tests/e2e -q

  # 4. security -------------------------------------------------------------
  security:
    name: SAST, dependencies, secrets, containers and IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}"}
      - run: pip install -e "backend[dev]" bandit pip-audit
      - name: Bandit (SAST)
        run: cd backend && bandit -r src -ll -f sarif -o bandit.sarif || true
      - name: pip-audit (SCA)
        run: cd backend && pip-audit --strict || true
      - name: Gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Trivy (filesystem and IaC)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Terraform format and validate
        run: |
          cd infra/terraform
          terraform fmt -check -recursive || true

  # 5. accessibility --------------------------------------------------------
  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}", cache: pnpm}
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - name: axe (zero critical or serious violations)
        run: pnpm a11y

  # 6. image build and promotion -------------------------------------------
  build:
    name: Build immutable images
    runs-on: ubuntu-latest
    needs: [static, unit, integration, security]
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials via OIDC
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          tags: airevenueos-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the built image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: airevenueos-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      # The same digest is promoted through every environment; images are never
      # rebuilt per environment.
